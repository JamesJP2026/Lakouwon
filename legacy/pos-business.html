<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion Business — POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#132340; --navy-2:#1c3358; --gold:#c8973f; --gold-light:#e9c98a;
    --paper:#f6f4ef; --card:#ffffff; --ink:#182233; --ink-soft:#5b6577; --line:#e4e0d6;
    --green:#2f7d5a; --green-bg:#e7f3ec; --red:#b8433a; --red-bg:#fbebe9;
    --amber:#b7791f; --amber-bg:#fbf1de; --radius:10px;
    --shadow:0 1px 2px rgba(19,35,64,.06), 0 6px 20px rgba(19,35,64,.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.num{font-family:'Manrope',sans-serif;}
  .num{font-variant-numeric:tabular-nums;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:14px;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#d8d3c5;border-radius:8px;}
  #app{display:flex; min-height:100vh;}

  .sidebar{width:230px; background:var(--navy); color:#dbe3f0; flex-shrink:0; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
  .brand{padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; align-items:center; gap:10px;}
  .brand-logo{width:34px; height:34px; border-radius:7px; object-fit:cover; background:#fff; flex-shrink:0;}
  .brand-name{font-family:'Manrope'; font-weight:800; font-size:16px; color:#fff; letter-spacing:.2px; line-height:1.2;}
  .brand-sub{font-size:11px; color:var(--gold-light); margin-top:2px;}
  .store-select{margin:14px 16px;}
  .store-select label{display:block; font-size:10.5px; color:#93a2bd; margin-bottom:5px;}
  .store-select select{width:100%; padding:8px 9px; border-radius:7px; border:1px solid rgba(255,255,255,.15); background:var(--navy-2); color:#fff; font-size:13px;}
  nav.navlinks{flex:1; padding:6px 10px; overflow-y:auto;}
  .navlink{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; color:#c4cee2; font-size:13.5px; font-weight:500; margin-bottom:2px; border:none; background:none; width:100%; text-align:left;}
  .navlink:hover{background:rgba(255,255,255,.06); color:#fff;}
  .navlink.active{background:var(--gold); color:#1a1305; font-weight:700;}
  .navlink .ic{width:17px; text-align:center; opacity:.9; font-size:14px;}
  .sidebar-foot{padding:14px 16px; border-top:1px solid rgba(255,255,255,.08); font-size:12px; color:#93a2bd;}
  .sidebar-foot b{color:#e7ecf5;}

  .main{flex:1; min-width:0; padding:26px 30px 60px;}
  .topbar{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  .topbar h1{font-size:22px; margin:0 0 4px; font-weight:800;}
  .topbar p{margin:0; color:var(--ink-soft); font-size:13px;}
  .topbar-actions{display:flex; gap:10px; flex-wrap:wrap;}

  .btn{padding:9px 15px; border-radius:8px; border:1px solid var(--line); background:var(--card); font-size:13.5px; font-weight:600; color:var(--ink); display:inline-flex; align-items:center; gap:7px;}
  .btn:hover{border-color:#c9c2ab;}
  .btn-primary{background:var(--navy); color:#fff; border-color:var(--navy);}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-gold{background:var(--gold); color:#1a1305; border-color:var(--gold);}
  .btn-danger{background:var(--red-bg); color:var(--red); border-color:#f0cfcb;}
  .btn-sm{padding:5px 10px; font-size:12.5px; border-radius:6px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:22px;}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);}
  .kpi .lbl{font-size:11.5px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.4px;}
  .kpi .val{font-size:24px; font-weight:800; margin-top:6px;}
  .kpi .sub{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .kpi.pos .val{color:var(--green);} .kpi.neg .val{color:var(--red);} .kpi.gold .val{color:var(--gold);}

  .period-tabs{display:flex; gap:6px; margin-bottom:16px;}
  .period-tab{padding:6px 13px; border-radius:20px; border:1px solid var(--line); background:var(--card); font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .period-tab.active{background:var(--navy); color:#fff; border-color:var(--navy);}

  .grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr;}}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); margin-bottom:16px;}
  .panel h3{margin:0 0 12px; font-size:14.5px; font-weight:800;}
  .panel h3 .n{color:var(--ink-soft); font-weight:500; font-size:12px;}

  .alert-item{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; gap:10px;}
  .alert-item:last-child{border-bottom:none;}
  .tag{padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700;}
  .tag.low{background:var(--red-bg); color:var(--red);}

  .log-item{padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
  .log-item:last-child{border-bottom:none;}
  .log-time{color:var(--ink-soft); font-size:11.5px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; padding:9px 10px; background:#f1efe7; color:var(--ink-soft); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.3px; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .muted{color:var(--ink-soft);}
  .right{text-align:right;} .center{text-align:center;}

  .badge{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; display:inline-block;}
  .badge.cash{background:var(--green-bg); color:var(--green);}
  .badge.banque{background:#e7edfb; color:#2b52a3;}
  .badge.moncash{background:#f4e6fb; color:#7c3aa8;}
  .badge.credit{background:var(--amber-bg); color:var(--amber);}
  .badge.role-Admin{background:var(--navy); color:#fff;}
  .badge.role-Gerant{background:var(--amber-bg); color:var(--amber);}
  .badge.role-Caissier{background:#eef0f4; color:var(--ink-soft);}

  .toolbar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .search{padding:8px 12px; border:1px solid var(--line); border-radius:8px; font-size:13px; min-width:200px; background:var(--card);}

  .overlay{position:fixed; inset:0; background:rgba(19,25,40,.5); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50;}
  .modal{background:var(--card); border-radius:12px; width:100%; max-width:480px; padding:22px 24px; box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal.wide{max-width:700px;}
  .modal h2{font-size:17px; margin:0 0 16px; font-weight:800;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px; background:#fdfcfa;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold-light); border-color:var(--gold);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
  .info-box{background:#f8f6f0; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:12.5px; margin-bottom:12px;}

  .pos-grid{display:grid; grid-template-columns:1.4fr 1fr; gap:16px;}
  @media(max-width:960px){.pos-grid{grid-template-columns:1fr;}}
  .prod-pick{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; max-height:520px; overflow-y:auto; padding-right:4px;}
  .prod-card{border:1px solid var(--line); border-radius:9px; padding:11px; background:var(--card);}
  .prod-card:hover{border-color:var(--gold);}
  .prod-card.out{opacity:.45;}
  .prod-card .pn{font-weight:700; font-size:13px; margin-bottom:3px;}
  .prod-card .pp{color:var(--green); font-weight:700; font-size:13px;}
  .prod-card .pq{font-size:11px; color:var(--ink-soft); margin-top:3px;}
  .cart-item{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .cart-item .ci-name{flex:1; font-weight:600;}
  .cart-item input[type=number]{width:52px; padding:5px; border:1px solid var(--line); border-radius:6px;}
  .cart-total{display:flex; justify-content:space-between; font-size:16px; font-weight:800; padding:14px 0 4px; border-top:2px solid var(--navy); margin-top:10px;}
  .pay-modes{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:10px 0;}
  .pay-mode{padding:10px 6px; border:1px solid var(--line); border-radius:8px; text-align:center; font-size:12px; font-weight:700; background:var(--card);}
  .pay-mode.active{background:var(--navy); color:#fff; border-color:var(--navy);}

  .empty{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  select[disabled],input[disabled]{background:#f1efe7; color:var(--ink-soft);}
  .logo-preview{width:64px; height:64px; object-fit:contain; border:1px solid var(--line); border-radius:8px; background:#fff; padding:4px;}
  .client-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .client-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;}
  .cc-avatar{width:42px; height:42px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; flex-shrink:0;}
  .cc-name{font-weight:800; font-size:14.5px;}
  .cc-phone{font-size:12px;}
  .cc-stats{display:flex; justify-content:space-between; font-size:12.5px; padding:9px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .cc-debt{font-size:13px; font-weight:700; color:var(--green);}
  .cc-debt.debt-pos{color:var(--red);}
  .cc-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .product-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;}
  .product-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px;}
  .pc-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .pc-name{font-weight:800; font-size:14px; line-height:1.25;}
  .pc-cat{font-size:11.5px; margin-top:-6px;}
  .pc-lots{background:#f8f6f0; border-radius:7px; padding:7px 9px; min-height:30px;}
  .pc-meta{font-size:10.5px;}
  .breakdown-row{display:flex; justify-content:space-between; padding:5px 0; font-size:13px;}
  .breakdown-row.total{border-top:2px solid var(--navy); margin-top:6px; padding-top:8px; font-weight:800; font-size:15px;}

  @media print{
    body *{visibility:hidden;}
    #receipt,#receipt *{visibility:visible;}
    #receipt{position:fixed; top:0; left:0; width:100%; padding:20px;}
  }
  #receipt{display:none;}
</style>
</head>
<body>
<div id="app"></div>
<div id="receipt"></div>

<script>
/* =========================================================
   ETAT & PERSISTANCE
========================================================= */
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
async function hashText(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashPasswordSalted(pw, salt){ return hashText(pw+':'+salt); }
async function verifyPassword(pw, emp){
  if(emp.passwordSalt){ return (await hashPasswordSalted(pw, emp.passwordSalt)) === emp.passwordHash; }
  return (await hashText(pw)) === emp.passwordHash; // compatibilité avec les comptes créés avant le salage
}
function generatePassword(len=8){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  let out = '';
  for(let i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
const fmt = n => (Number(n)||0).toLocaleString('fr-FR',{maximumFractionDigits:2});
const money = n => fmt(n) + ' ' + state.settings.devise;
const nowStr = () => new Date().toLocaleString('fr-FR');

let state = null;
let loginState = {loggedIn:false};
let loginError = '';
let loginAttempts = 0;
let loginLockUntil = 0;
let changePwError = '';
let generatedPasswordPreview = '';
let view = 'dashboard';
let period = 'today';
let editing = null;
let cart = [];
let posClientId = '';
let posPayMode = 'cash';
let posDeposit = 0;
let posDepositMode = 'cash';
let posMontantRecu = 0;
let posRemiseType = 'montant';
let posRemiseValeur = 0;
let posEncaissementPartiel = false;
let proformaView = 'liste';
let proformaCart = [];
let proformaClientId = '';
let proformaClientNomLibre = '';
let proformaNotes = '';
let ficheSearch = '';
let productLotsDraft = [];
let permissionsDraft = [];
let dashboardSearchQuery = '';
let rapportDate = '';
let magasinLogoDraft = null;
let transfertView = 'liste';
let transfertSourceId = '';
let transfertDestId = '';
let transfertCart = [];
let produitsFiltre = 'actifs';
let toast = null;

function defaultState(){
  const magasinId = uid();
  const adminId = uid();
  return {
    settings:{ nomCommerce:'Mon Commerce', adresse:'', email:'', telephone:'', devise:'HTG', logo:'', couleurPrimaire:'#132340', couleurAccent:'#c8973f' },
    magasins:[{id:magasinId, nom:'Magasin Principal', adresse:'', telephone:'', email:'', logo:''}],
    currentMagasinId: magasinId,
    currentUserId: adminId,
    employes:[{id:adminId, nom:'Administrateur', role:'Admin', magasinId, salaire:0, telephone:'', email:'', passwordHash:'', actif:true}],
    payrollPaiements:[],
    produits:[],
    clients:[],
    ventes:[],
    proformas:[],
    transferts:[],
    achats:[],
    caisseMovements:[],
    journal:[]
  };
}

function migrateState(s){
  s.settings.adresse = s.settings.adresse || '';
  s.settings.email = s.settings.email || '';
  s.settings.telephone = s.settings.telephone || '';
  s.settings.logo = s.settings.logo || '';
  s.settings.couleurPrimaire = s.settings.couleurPrimaire || '#132340';
  s.settings.couleurAccent = s.settings.couleurAccent || '#c8973f';
  s.proformas = s.proformas || [];
  s.transferts = s.transferts || [];
  s.achats = s.achats || [];
  (s.magasins||[]).forEach(m=>{
    if(m.telephone==null) m.telephone = '';
    if(m.email==null) m.email = '';
    if(m.logo==null) m.logo = '';
  });
  (s.produits||[]).forEach(p=>{
    if(p.quantiteParCaisse==null) p.quantiteParCaisse = 1;
    if(p.quantiteCaisse==null) p.quantiteCaisse = 0;
    if(p.quantiteDetail==null) p.quantiteDetail = p.quantite||0;
    if(p.prixVenteDetail==null) p.prixVenteDetail = p.prixVente||0;
    if(p.stockMinimum==null) p.stockMinimum = p.seuilAlerte||0;
    if(p.stockInitial==null) p.stockInitial = (p.quantiteCaisse*p.quantiteParCaisse)+(p.quantiteDetail||0);
    if(p.lots==null){
      p.lots = (p.venteEnLot && p.prixVenteGros>0) ? [{id:uid(), taille:p.quantiteParCaisse||1, prix:p.prixVenteGros}] : [];
    }
    if(p.archive==null) p.archive = false;
    if(p.dateCreation==null) p.dateCreation = new Date().toISOString();
  });
  (s.ventes||[]).forEach(v=>{
    if(v.paiements==null) v.paiements = [];
    if(v.montantRecu==null) v.montantRecu = v.montantPaye||0;
    if(v.monnaieRendue==null) v.monnaieRendue = 0;
  });
  (s.employes||[]).forEach(e=>{
    if(e.permissions==null) e.permissions = (PERMS_PRESETS_MIGRATE[e.role]||[]).slice();
    else if(e.role==='Admin'){
      // Un Admin a toujours accès à tout, y compris les nouveaux modules ajoutés ultérieurement
      e.permissions = PERMS_ALL.slice();
    } else {
      // Rétablit automatiquement les nouveaux modules pour les rôles standards non personnalisés
      const preset = PERMS_PRESETS_MIGRATE[e.role];
      if(preset){ preset.forEach(k=>{ if(!e.permissions.includes(k)) e.permissions.push(k); }); }
    }
    if(e.email==null) e.email = '';
    if(e.passwordHash==null) e.passwordHash = '';
    if(e.passwordSalt==null) e.passwordSalt = '';
  });
  return s;
}
const PERMS_PRESETS_MIGRATE = {
  Admin:['dashboard','vente','fiches','proforma','produits','clients','caisse','depenses','transferts','achats','employes','journal','parametres','rapport'],
  Gerant:['dashboard','vente','fiches','proforma','produits','clients','caisse','depenses','transferts','achats','employes','journal','rapport'],
  Caissier:['dashboard','vente','fiches','clients','caisse']
};

function shadeColor(hex, percent){
  hex = (hex||'#132340').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  let f = parseInt(hex,16);
  let t = percent<0 ? 0 : 255;
  let p = percent<0 ? percent*-1 : percent;
  let R = f>>16, G = f>>8&0x00FF, B = f&0x0000FF;
  const newR = Math.round((t-R)*p)+R, newG = Math.round((t-G)*p)+G, newB = Math.round((t-B)*p)+B;
  return '#'+(0x1000000+newR*0x10000+newG*0x100+newB).toString(16).slice(1);
}
function applyTheme(){
  const navy = (state.settings.couleurPrimaire) || '#132340';
  const gold = (state.settings.couleurAccent) || '#c8973f';
  document.documentElement.style.setProperty('--navy', navy);
  document.documentElement.style.setProperty('--navy-2', shadeColor(navy, 0.18));
  document.documentElement.style.setProperty('--gold', gold);
  document.documentElement.style.setProperty('--gold-light', shadeColor(gold, 0.4));
}
const THEME_PRESETS = [
  {nom:'Marine & Or', navy:'#132340', gold:'#c8973f'},
  {nom:'Émeraude', navy:'#0f3d2e', gold:'#22c55e'},
  {nom:'Bleu Royal', navy:'#1e3a8a', gold:'#3b82f6'},
  {nom:'Bordeaux', navy:'#5c1a1a', gold:'#e0703a'},
  {nom:'Violet', navy:'#2e1a47', gold:'#a855f7'},
  {nom:'Ardoise', navy:'#1f2937', gold:'#d97706'},
];

const STORAGE_KEY = 'pos-business-data-v1';
async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? migrateState(JSON.parse(raw)) : defaultState();
  }catch(e){ state = defaultState(); }
  applyTheme();
  autoArchiverProduitsInactifs();
  try{
    const sessionId = sessionStorage.getItem('pos-session');
    if(sessionId){
      const emp = state.employes.find(e=>e.id===sessionId);
      if(emp && emp.actif && emp.passwordHash){
        loginState.loggedIn = true;
        state.currentUserId = emp.id;
      } else {
        sessionStorage.removeItem('pos-session');
      }
    }
  }catch(e){}
  render();
}

let saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('Erreur de sauvegarde', e); showToast("Erreur de sauvegarde — espace de stockage plein ?"); }
  }, 150);
}

function log(action, details){
  state.journal.unshift({id:uid(), date:new Date().toISOString(), action, details, employeId:state.currentUserId, magasinId:state.currentMagasinId});
  if(state.journal.length > 2000) state.journal.length = 2000;
}

function currentUser(){ return state.employes.find(e=>e.id===state.currentUserId) || state.employes[0]; }
function isAdminConnecte(){ const u = currentUser(); return !!u && u.role==='Admin'; }
const PERMS_ALL = ['dashboard','vente','fiches','proforma','produits','clients','caisse','depenses','transferts','achats','rapport','employes','journal','parametres'];
const PERMS_LABELS = {
  dashboard:'Tableau de bord', vente:'Nouvelle vente', fiches:'Fiches de vente', proforma:'Proforma',
  produits:'Produits & Stock', clients:'Clients & Dettes', caisse:'Caisse', depenses:'Dépenses', transferts:'Transfert entre magasins', achats:'Historique des achats', rapport:'Rapport journalier',
  employes:'Employés & Paie', journal:'Journal', parametres:'Paramètres'
};

function magasinProduits(){ return state.produits.filter(p=>p.magasinId===state.currentMagasinId); }
function magasinProduitsActifs(){ return magasinProduits().filter(p=>!p.archive); }
function joursDepuisDerniereVente(produitId){
  let dernier = null;
  state.ventes.forEach(v=>{ (v.items||[]).forEach(i=>{ if(i.produitId===produitId){ const d=new Date(v.date); if(!dernier||d>dernier) dernier=d; } }); });
  if(!dernier) return null;
  return Math.floor((Date.now()-dernier.getTime())/(1000*60*60*24));
}
const SEUIL_ARCHIVAGE_JOURS = 60;
function autoArchiverProduitsInactifs(){
  let changed = false;
  state.produits.forEach(p=>{
    if(p.archive) return;
    const dateCreation = p.dateCreation ? new Date(p.dateCreation) : null;
    const ageJours = dateCreation ? Math.floor((Date.now()-dateCreation.getTime())/(1000*60*60*24)) : 9999;
    if(ageJours < SEUIL_ARCHIVAGE_JOURS) return;
    const joursSansVente = joursDepuisDerniereVente(p.id);
    if(joursSansVente===null || joursSansVente>=SEUIL_ARCHIVAGE_JOURS){
      p.archive = true; changed = true;
      log('Produit archivé automatiquement (aucune vente récente)', p.nom);
    }
  });
  if(changed) saveState();
}
function magasinClients(){ return state.clients.filter(c=>c.magasinId===state.currentMagasinId); }
function magasinVentes(){ return state.ventes.filter(v=>v.magasinId===state.currentMagasinId); }
function magasinCaisse(){ return state.caisseMovements.filter(m=>m.magasinId===state.currentMagasinId); }
function magasinEmployes(){ return state.employes.filter(e=>e.magasinId===state.currentMagasinId); }
function magasinProformas(){ return state.proformas.filter(p=>p.magasinId===state.currentMagasinId); }

function coutUnitaire(p){ const qpc = p.quantiteParCaisse>0? p.quantiteParCaisse : 1; return (p.prixAchat||0)/qpc; }
function stockUnites(p){ return (p.quantiteCaisse||0)*(p.quantiteParCaisse||1) + (p.quantiteDetail||0); }
function margePct(prixVente, cout){ return cout>0 ? ((prixVente-cout)/cout*100) : 0; }
function deduireStock(p, unitesADeduire){
  const qpc = p.quantiteParCaisse>0? p.quantiteParCaisse : 1;
  if(p.quantiteDetail >= unitesADeduire){ p.quantiteDetail -= unitesADeduire; }
  else{
    let reste = unitesADeduire - p.quantiteDetail;
    p.quantiteDetail = 0;
    const caissesNeeded = Math.ceil(reste/qpc);
    p.quantiteCaisse -= caissesNeeded;
    p.quantiteDetail = (caissesNeeded*qpc) - reste;
  }
}

function periodBounds(p){
  const now = new Date();
  if(p==='today') return new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(p==='week'){ const d = new Date(now); d.setDate(now.getDate()-7); return d; }
  if(p==='month') return new Date(now.getFullYear(),now.getMonth(),1);
  return new Date(2000,0,1);
}
function ventesPeriode(){ const start = periodBounds(period); return magasinVentes().filter(v=>new Date(v.date)>=start); }

function clientDette(clientId){ return state.ventes.filter(v=>v.clientId===clientId).reduce((s,v)=>s+(v.reste||0),0); }
function totalDettesMagasin(){ return magasinClients().reduce((s,c)=>s+clientDette(c.id),0); }
function valeurStock(){ return magasinProduits().reduce((s,p)=>s+(stockUnites(p)*coutUnitaire(p)),0); }
function soldeCaisse(){ return magasinCaisse().reduce((s,m)=>s+(m.type==='entree'?m.montant:-m.montant),0); }
function isDepense(m){ return m.type==='sortie' && (m.source==='manuel' || m.source==='payroll'); }

function kpisPeriode(){
  const ventes = ventesPeriode();
  const ca = ventes.reduce((s,v)=>s+v.total,0);
  const cmv = ventes.reduce((s,v)=>s+v.coutTotal,0);
  const margeBrute = ca-cmv;
  const margePctv = ca>0? (margeBrute/ca*100) : 0;
  const start = periodBounds(period);
  const depenses = magasinCaisse().filter(m=>isDepense(m) && new Date(m.date)>=start).reduce((s,m)=>s+m.montant,0);
  const beneficeNet = margeBrute - depenses;
  return {ca, cmv, margeBrute, margePct:margePctv, depenses, beneficeNet};
}

function empName(id){ const e = state.employes.find(x=>x.id===id); return e? e.nom : '—'; }
function clientName(id){ const c = state.clients.find(x=>x.id===id); return c? c.nom : 'Client comptant'; }
function unitsConsumed(item){ return item.mode==='gros' ? item.qte*item.uniteParLot : item.qte; }
function cartTotal(items){ return items.reduce((s,i)=>s+i.qte*i.prixVente,0); }
function cartCost(items){ return items.reduce((s,i)=>s+i.qte*i.coutUnitaire,0); }
function remiseMontant(totalBrut){
  if(posRemiseValeur<=0) return 0;
  const m = posRemiseType==='pourcentage' ? totalBrut*(posRemiseValeur/100) : posRemiseValeur;
  return Math.max(0, Math.min(m, totalBrut));
}
function venteTotalNet(){
  const brut = cartTotal(cart);
  return Math.max(0, brut - remiseMontant(brut));
}
function remiseSummaryHTML(){
  const brut = cartTotal(cart);
  const remise = remiseMontant(brut);
  const net = Math.max(0, brut-remise);
  if(remise<=0) return `<div class="cart-total"><span>Total</span><span class="num">${money(brut)}</span></div>`;
  return `
    <div class="breakdown-row"><span>Sous-total</span><span class="num">${money(brut)}</span></div>
    <div class="breakdown-row"><span>Remise</span><span class="num" style="color:var(--red);">-${money(remise)}</span></div>
    <div class="cart-total"><span>Total net</span><span class="num">${money(net)}</span></div>`;
}

function attachLoginEvents(){
  const doLogin = async ()=>{
    if(Date.now() < loginLockUntil){
      const secs = Math.ceil((loginLockUntil-Date.now())/1000);
      loginError = `Trop de tentatives échouées. Réessayez dans ${secs} seconde(s).`;
      render(); return;
    }
    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const pw = document.getElementById('login-password').value;
    const emp = state.employes.find(e=>(e.email||'').toLowerCase()===email);
    let ok = false;
    if(emp && emp.passwordHash && emp.actif){ ok = await verifyPassword(pw, emp); }
    if(!ok){
      loginAttempts++;
      if(loginAttempts>=5){
        loginLockUntil = Date.now()+30000;
        loginAttempts = 0;
        loginError = 'Trop de tentatives échouées. Compte verrouillé 30 secondes.';
      } else {
        loginError = (emp && !emp.actif) ? 'Ce compte est désactivé.' : 'Identifiants invalides.';
      }
      render(); return;
    }
    loginAttempts = 0;
    loginError = '';
    loginState.loggedIn = true;
    state.currentUserId = emp.id;
    if(emp.magasinId && state.magasins.some(m=>m.id===emp.magasinId)) state.currentMagasinId = emp.magasinId;
    try{ sessionStorage.setItem('pos-session', emp.id); }catch(e){}
    log('Connexion', emp.nom);
    saveState();
    render();
  };
  const btn = document.getElementById('btn-login'); if(btn) btn.onclick = doLogin;
  const pwInp = document.getElementById('login-password'); if(pwInp) pwInp.onkeydown = e=>{ if(e.key==='Enter') doLogin(); };
}

  return Object.keys(groups).filter(k=>groups[k]>0).map(k=>({label:labels[k]||k, value:groups[k], color:colors[k]||'#5b6577'}));
}
function stockParCategorie(){
  const groups = {};
  magasinProduits().forEach(p=>{ const cat = p.categorie||'Sans catégorie'; groups[cat] = (groups[cat]||0) + stockUnites(p)*coutUnitaire(p); });

  return Object.keys(groups).filter(k=>groups[k]>0).map((k,i)=>({label:k, value:groups[k], color:palette[i%palette.length]}));

function renderPieChart(data){
  const total = data.reduce((s,d)=>s+d.value,0);
  if(total<=0) return `<div class="muted">Pas assez de données pour ce graphique.</div>`;
  let acc = 0;
  const stops = data.map(d=>{ const start=acc/total*360; acc+=d.value; const end=acc/total*360; return `${d.color} ${start}deg ${end}deg`; }).join(', ');
  return `<div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
    <div style="width:130px; height:130px; border-radius:50%; background:conic-gradient(${stops}); flex-shrink:0; box-shadow:inset 0 0 0 30px var(--card), var(--shadow);"></div>
    <div style="flex:1; min-width:160px;">
      ${data.map(d=>`<div style="display:flex; align-items:center; gap:8px; font-size:12.5px; margin-bottom:6px;">
        <span style="width:11px;height:11px;border-radius:3px;background:${d.color};display:inline-block; flex-shrink:0;"></span>
        <span>${d.label}</span><span class="muted num" style="margin-left:auto; white-space:nowrap;">${(d.value/total*100).toFixed(0)}%</span>
      </div>`).join('')}

  </div>`;
}

function searchFichesEtProformas(q){

  if(!q) return [];
  const ventes = magasinVentes().filter(v=> v.numero.toLowerCase().includes(q) || clientName(v.clientId).toLowerCase().includes(q))
    .map(v=>({type:'vente', id:v.id, numero:v.numero, client: v.clientId? clientName(v.clientId) : 'Comptant', total:v.total, date:v.date}));
  const pfs = magasinProformas().filter(p=> p.numero.toLowerCase().includes(q) || (p.clientId? clientName(p.clientId) : (p.clientNomLibre||'')).toLowerCase().includes(q))
    .map(p=>({type:'proforma', id:p.id, numero:p.numero, client: p.clientId? clientName(p.clientId) : (p.clientNomLibre||'—'), total:p.total, date:p.date}));
  return [...ventes, ...pfs].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,20);

function pronosticStock(){
  const produits = magasinProduits().filter(p=>!p.archive);
  let valeurAchat=0, valeurVenteDetail=0;
  produits.forEach(p=>{
    const stock = stockUnites(p);
    valeurAchat += stock*coutUnitaire(p);
    valeurVenteDetail += stock*(p.prixVenteDetail||0);
  });
  const beneficePotentiel = valeurVenteDetail - valeurAchat;
  const margePotentiellePct = valeurAchat>0 ? (beneficePotentiel/valeurAchat*100) : 0;
  return {valeurAchat, valeurVenteDetail, beneficePotentiel, margePotentiellePct};
}

function addToCart(prodId){
  const p = state.produits.find(x=>x.id===prodId);
  if(!p) return;
  const stock = stockUnites(p);
  const dejaUnites = cart.filter(i=>i.produitId===prodId).reduce((s,i)=>s+unitsConsumed(i),0);
  if(dejaUnites + 1 > stock){ showToast('Stock insuffisant'); return; }
  const existing = cart.find(i=>i.produitId===prodId && i.mode==='detail');
  if(existing){ existing.qte += 1; }
  else{ cart.push({produitId:p.id, nom:p.nom, mode:'detail', qte:1, prixVente:p.prixVenteDetail, coutUnitaire:coutUnitaire(p), uniteParLot:1}); }
  render();
}
function addLotToCart(prodId, lotId){
  const p = state.produits.find(x=>x.id===prodId);
  if(!p) return;
  const lot = (p.lots||[]).find(l=>l.id===lotId);
  if(!lot) return;
  const stock = stockUnites(p);
  const dejaUnites = cart.filter(i=>i.produitId===prodId).reduce((s,i)=>s+unitsConsumed(i),0);
  if(dejaUnites + lot.taille > stock){ showToast('Stock insuffisant'); return; }
  const existing = cart.find(i=>i.produitId===prodId && i.mode==='gros' && i.lotId===lotId);
  if(existing){ existing.qte += 1; }
  else{ cart.push({produitId:p.id, nom:`${p.nom} — Lot de ${lot.taille}`, mode:'gros', lotId:lot.id, qte:1, prixVente:lot.prix, coutUnitaire:coutUnitaire(p)*lot.taille, uniteParLot:lot.taille}); }
  render();
}

function finalizeSale(montantRecuConfirme){
  if(cart.length===0) return;
  const produits = magasinProduits();
  const totauxParProduit = {};
  for(const item of cart){ totauxParProduit[item.produitId] = (totauxParProduit[item.produitId]||0) + unitsConsumed(item); }
  for(const pid in totauxParProduit){
    const p = produits.find(x=>x.id===pid);
    if(!p || totauxParProduit[pid] > stockUnites(p)){ showToast(`Stock insuffisant pour ${p?p.nom:''}`); return; }
  }

  const totalBrut = cartTotal(cart);
  const remise = remiseMontant(totalBrut);
  const total = Math.max(0, totalBrut - remise);
  const coutTotal = cartCost(cart);
  const montantRecu = Math.max(0, montantRecuConfirme!=null ? montantRecuConfirme : total);
  const reste = posEncaissementPartiel ? Math.max(0, total - montantRecu) : 0;
  const montantPaye = total - reste;
  const monnaieRendue = Math.max(0, montantRecu - total);
  const cashMode = posDepositMode || (posPayMode==='credit' ? 'cash' : posPayMode);

  if(!posEncaissementPartiel && montantRecu<total){ showToast('Montant insuffisant, ou cochez "Paiement partiel"'); return; }
  if(reste>0 && !posClientId){ showToast("Sélectionnez un client pour l'encaissement partiel"); return; }

  const modePaiementFinal = reste>0 ? 'credit' : cashMode;

  const vente = {
    id: editingVenteId || uid(), numero: editingVenteNumero || ('V'+Date.now().toString().slice(-8)),
    magasinId:state.currentMagasinId, date:new Date().toISOString(),
    items: cart.map(i=>({produitId:i.produitId, nom:i.nom, mode:i.mode, qte:i.qte, uniteParLot:i.uniteParLot, prixVente:i.prixVente, coutUnitaire:i.coutUnitaire})),
    totalBrut, remise, total, coutTotal, modePaiement:modePaiementFinal, montantRecu, monnaieRendue, montantPaye, reste,
    clientId: (reste>0 || posClientId) ? posClientId : '', employeId:state.currentUserId, paiements:[]
  };
  state.ventes.push(vente);

  for(const pid in totauxParProduit){ deduireStock(state.produits.find(x=>x.id===pid), totauxParProduit[pid]); }

  if(cashMode==='cash'){
    if(montantRecu>0) state.caisseMovements.push({id:uid(), magasinId:state.currentMagasinId, date:new Date().toISOString(), type:'entree', montant:montantRecu, motif:`Vente ${vente.numero}`, employeId:state.currentUserId, source:'vente', venteId:vente.id});
    if(monnaieRendue>0) state.caisseMovements.push({id:uid(), magasinId:state.currentMagasinId, date:new Date().toISOString(), type:'sortie', montant:monnaieRendue, motif:`Monnaie rendue — ${vente.numero}`, employeId:state.currentUserId, source:'monnaie', venteId:vente.id});
  }

  const etaitModification = !!editingVenteId;
  log(etaitModification? `Fiche ${vente.numero} modifiée` : `Vente ${vente.numero} enregistrée`, `${money(total)} · ${modePaiementFinal}${remise>0?' · remise '+money(remise):''}${reste>0?' · reste '+money(reste):''}${monnaieRendue>0?' · monnaie '+money(monnaieRendue):''}`);
  saveState();

  editingVenteId = null; editingVenteNumero = null; editingVenteBackup = null;
  cart = []; posPayMode='cash'; posClientId=''; posDepositMode='cash'; posMontantRecu=0; posRemiseType='montant'; posRemiseValeur=0;
  showToast(etaitModification? 'Fiche modifiée avec succès' : 'Vente enregistrée avec succès');
  printReceipt(vente);
}

/* =========================================================

========================================================= */
function todayISOLocal(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function rapportDuJour(dateStr){
  const start = new Date(dateStr+'T00:00:00');
  const end = new Date(dateStr+'T23:59:59.999');
  const dansLaJournee = d => { const dt = new Date(d); return dt>=start && dt<=end; };
  const ventes = magasinVentes().filter(v=>dansLaJournee(v.date)).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const proformas = magasinProformas().filter(p=>dansLaJournee(p.date)).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const paiementsDette = [];
  magasinVentes().forEach(v=>{ (v.paiements||[]).forEach(p=>{ if(dansLaJournee(p.date)) paiementsDette.push({...p, venteNumero:v.numero, clientNom: v.clientId?clientName(v.clientId):'—'}); }); });
  paiementsDette.sort((a,b)=>new Date(a.date)-new Date(b.date));
  const depenses = magasinCaisse().filter(m=>isDepense(m) && dansLaJournee(m.date));
  const ca = ventes.reduce((s,v)=>s+v.total,0);
  const cmv = ventes.reduce((s,v)=>s+v.coutTotal,0);
  const totalDepenses = depenses.reduce((s,m)=>s+m.montant,0);
  const beneficeNet = (ca-cmv) - totalDepenses;
  const parMode = {};
  ventes.forEach(v=>{ parMode[v.modePaiement] = (parMode[v.modePaiement]||0) + v.montantPaye; });
  return {ventes, proformas, paiementsDette, depenses, ca, cmv, totalDepenses, beneficeNet, parMode};
}

function ajouterAuTransfert(prodId){
  const p = state.produits.find(x=>x.id===prodId);
  if(!p) return;
  const stock = stockUnites(p);
  const deja = transfertCart.filter(i=>i.produitId===prodId).reduce((s,i)=>s+i.qte,0);
  if(deja+1 > stock){ showToast('Stock insuffisant dans le magasin source'); return; }
  const existing = transfertCart.find(i=>i.produitId===prodId);
  if(existing){ existing.qte += 1; } else { transfertCart.push({produitId:p.id, nom:p.nom, qte:1}); }
  render();
}
function executeTransfert(){
  const src = transfertSourceId, dst = transfertDestId;
  if(!src || !dst || src===dst || transfertCart.length===0) return;
  const numero = 'T'+Date.now().toString().slice(-8);
  const itemsLog = [];
  transfertCart.forEach(item=>{
    const pSrc = state.produits.find(x=>x.id===item.produitId);
    if(!pSrc) return;
    deduireStock(pSrc, item.qte);
    let pDst = state.produits.find(p=>p.magasinId===dst && p.nom.toLowerCase()===pSrc.nom.toLowerCase());
    if(!pDst){
      pDst = {
        id: uid(), magasinId: dst, nom: pSrc.nom, categorie: pSrc.categorie,
        quantiteParCaisse: pSrc.quantiteParCaisse, prixAchat: pSrc.prixAchat,
        quantiteCaisse: 0, quantiteDetail: 0, prixVenteDetail: pSrc.prixVenteDetail,
        stockInitial: 0, stockMinimum: pSrc.stockMinimum, lots: (pSrc.lots||[]).map(l=>({...l, id:uid()}))
      };
      state.produits.push(pDst);
    }
    pDst.quantiteDetail = (pDst.quantiteDetail||0) + item.qte;
    itemsLog.push(`${pSrc.nom} ×${item.qte}`);
  });
  state.transferts.push({id:uid(), numero, date:new Date().toISOString(), magasinSourceId:src, magasinDestId:dst, items:transfertCart.map(i=>({...i})), employeId:state.currentUserId});
  const srcNom = state.magasins.find(m=>m.id===src)?.nom || '';
  const dstNom = state.magasins.find(m=>m.id===dst)?.nom || '';
  log(`Transfert ${numero}`, `${itemsLog.join(', ')} · de ${srcNom} vers ${dstNom}`);
  saveState();
  transfertCart=[]; transfertView='liste'; editing=null;
  showToast('Transfert confirmé — stock mis à jour dans les deux magasins');
  render();
}

/* =========================================================

========================================================= */
function allocatePaymentToClient(clientId, montant, mode){
  let restant = montant;
  const ventesClient = state.ventes.filter(v=>v.clientId===clientId && v.reste>0).sort((a,b)=>new Date(a.date)-new Date(b.date));
  for(const v of ventesClient){
    if(restant<=0) break;
    const pay = Math.min(restant, v.reste);
    v.reste -= pay; v.montantPaye += pay; v.paiements = v.paiements||[];
    v.paiements.push({id:uid(), montant:pay, mode, date:new Date().toISOString(), employeId:state.currentUserId});
    restant -= pay;
  }
  if(mode==='cash' && montant>0){
    state.caisseMovements.push({id:uid(), magasinId:state.currentMagasinId, date:new Date().toISOString(), type:'entree', montant, motif:`Paiement dette — ${clientName(clientId)}`, employeId:state.currentUserId, source:'paiement_dette'});
  }
  log('Paiement de dette reçu', `${clientName(clientId)} · ${money(montant)}`);
}

function paySpecificVente(venteId, montant, mode){
  const v = state.ventes.find(x=>x.id===venteId);
  if(!v) return;
  const pay = Math.min(montant, v.reste);
  if(pay<=0) return;
  v.reste -= pay; v.montantPaye += pay; v.paiements = v.paiements||[];
  v.paiements.push({id:uid(), montant:pay, mode, date:new Date().toISOString(), employeId:state.currentUserId});
  if(mode==='cash'){
    state.caisseMovements.push({id:uid(), magasinId:state.currentMagasinId, date:new Date().toISOString(), type:'entree', montant:pay, motif:`Paiement fiche ${v.numero}`, employeId:state.currentUserId, source:'paiement_dette', venteId:v.id});
  }
  log('Paiement reçu sur fiche', `${v.numero} · ${money(pay)}`);
}

function restaurerStockVente(v){
  v.items.forEach(item=>{
    const p = state.produits.find(x=>x.id===item.produitId);
    if(p){ p.quantiteDetail = (p.quantiteDetail||0) + unitsConsumed(item); }
  });
}
function retirerCaisseVente(venteId, numero){
  state.caisseMovements = state.caisseMovements.filter(m=> m.venteId!==venteId && !(m.motif && m.motif.includes(numero)));
}
function supprimerVente(venteId){
  const v = state.ventes.find(x=>x.id===venteId);
  if(!v) return;
  restaurerStockVente(v);
  retirerCaisseVente(v.id, v.numero);
  state.ventes = state.ventes.filter(x=>x.id!==venteId);
  log('Vente supprimée', `${v.numero} · ${money(v.total)}`);
  saveState();
}

let editingVenteId = null;
let editingVenteNumero = null;
let editingVenteBackup = null;
function commencerModificationVente(venteId){
  const v = state.ventes.find(x=>x.id===venteId);
  if(!v) return;
  const proceder = ()=>{
    editingVenteBackup = {
      ventes: JSON.parse(JSON.stringify(state.ventes)),
      produits: JSON.parse(JSON.stringify(state.produits)),
      caisseMovements: JSON.parse(JSON.stringify(state.caisseMovements))
    };
    editingVenteId = v.id;
    editingVenteNumero = v.numero;
    restaurerStockVente(v);
    retirerCaisseVente(v.id, v.numero);
    state.ventes = state.ventes.filter(x=>x.id!==venteId);
    cart = v.items.map(i=>({...i}));
    posPayMode = (v.modePaiement==='credit') ? 'credit' : v.modePaiement;
    posClientId = v.clientId||'';
    posRemiseType = 'montant';
    posRemiseValeur = v.remise||0;
    posDepositMode = 'cash';
    posMontantRecu = 0;
    posEncaissementPartiel = false;
    editing = null;
    view = 'vente';
    showToast(`Modification de la fiche ${v.numero} — ajustez le panier puis encaissez pour valider`);
    render();
  };
  if(v.paiements && v.paiements.length>0){
    askConfirm("Cette fiche a déjà reçu des paiements partiels. Les modifier effacera cet historique de paiement sur la fiche. Continuer ?", proceder);
  } else {
    proceder();
  }
}
function annulerModificationVente(){
  if(!editingVenteBackup) return;
  state.ventes = editingVenteBackup.ventes;
  state.produits = editingVenteBackup.produits;
  state.caisseMovements = editingVenteBackup.caisseMovements;
  editingVenteBackup = null; editingVenteId = null; editingVenteNumero = null;
  cart = []; posPayMode='cash'; posClientId=''; posRemiseType='montant'; posRemiseValeur=0;
  saveState();
}

    Marge détail : <b class="num" style="color:${color};">${mDetail.toFixed(1)}%</b> &nbsp;·&nbsp;
    <span style="color:${color}; font-weight:700;">${msg}</span>`;
}
function lotMarginText(p, taille, prix){
  const cout = coutUnitaire(p)*taille;
  const m = margePct(prix, cout);
  const ok = prix>0 && m>0;
  return `Coût du lot : ${money(cout)} · Marge : ${m.toFixed(1)}% ${ok?'✅':'⚠️'}`;
}

function cvDynamicHTML(){
  const total = venteTotalNet();
  const recu = posMontantRecu;
  const isPartial = posEncaissementPartiel;
  const reste = isPartial ? Math.max(0, total-recu) : 0;
  const monnaie = Math.max(0, recu-total);

  const clients = magasinClients();
  if(!isPartial){
    return `<div class="breakdown-row total"><span>Monnaie à remettre</span><span class="num" style="color:var(--green);">${money(monnaie)}</span></div>
      ${insuffisant? `<div class="muted" style="color:var(--red); font-size:12.5px; margin-top:4px;">Le montant reçu est inférieur au total. Cochez "Paiement partiel" si le client ne paie pas tout.</div>` : ''}`;

  return `

      <select id="f-cv-client"><option value="">— Sélectionner un client —</option>${clients.map(c=>`<option value="${c.id}" ${posClientId===c.id?'selected':''}>${c.nom}</option>`).join('')}</select>

}

function attachEvents(){
  document.querySelectorAll('.navlink').forEach(b=>b.onclick = ()=>{ view = b.dataset.view; render(); });
  const selMag = document.getElementById('sel-magasin'); if(selMag) selMag.onchange = e=>{ state.currentMagasinId = e.target.value; render(); };
  const btnLogout = document.getElementById('btn-logout'); if(btnLogout) btnLogout.onclick = ()=>{ loginState.loggedIn=false; try{ sessionStorage.removeItem('pos-session'); }catch(e){} render(); };
  const btnChangePw = document.getElementById('btn-change-password'); if(btnChangePw) btnChangePw.onclick = ()=>{ if(!isAdminConnecte()) return; changePwError=''; editing={type:'changePassword'}; render(); };
  const btnSaveChangePw = document.getElementById('btn-save-change-password');
  if(btnSaveChangePw) btnSaveChangePw.onclick = async ()=>{
    if(!isAdminConnecte()){ editing=null; render(); return; }
    const oldPw = document.getElementById('cp-old').value;
    const newPw = document.getElementById('cp-new').value;
    const newPw2 = document.getElementById('cp-new2').value;
    const u = currentUser();
    if(!(await verifyPassword(oldPw, u))){ changePwError='Mot de passe actuel incorrect.'; render(); return; }
    if(newPw.length<6){ changePwError='Le nouveau mot de passe doit contenir au moins 6 caractères.'; render(); return; }
    if(newPw!==newPw2){ changePwError='Les nouveaux mots de passe ne correspondent pas.'; render(); return; }
    const salt = uid();
    u.passwordSalt = salt;

    proformaView='liste'; showToast('Proforma enregistrée'); render();
  };
  document.querySelectorAll('[data-voir-proforma]').forEach(b=>b.onclick = ()=>{ editing={type:'voirProforma', id:b.dataset.voirProforma}; render(); });
  document.querySelectorAll('[data-print-proforma]').forEach(b=>b.onclick = ()=> printProforma(state.proformas.find(x=>x.id===b.dataset.printProforma)));
  document.querySelectorAll('[data-del-proforma]').forEach(b=>b.onclick = ()=>{
    askConfirm('Supprimer cette proforma ?', ()=>{ state.proformas = state.proformas.filter(x=>x.id!==b.dataset.delProforma); saveState(); editing=null; render(); });
  });
  function convertProformaToVente(pf){
    cart = pf.items.map(i=>({...i}));
    posClientId = pf.clientId||''; posPayMode = pf.clientId? 'credit' : 'cash'; posMontantRecu=0; posDepositMode='cash';
    view='vente'; editing=null; showToast('Proforma chargée dans le panier de vente'); render();
  }
  document.querySelectorAll('[data-convert-proforma]').forEach(b=>b.onclick = ()=> convertProformaToVente(state.proformas.find(x=>x.id===b.dataset.convertProforma)));
  const btnReprintProforma = document.getElementById('btn-reprint-proforma'); if(btnReprintProforma) btnReprintProforma.onclick = ()=> printProforma(state.proformas.find(x=>x.id===editing.id));
  const btnConvertProformaModal = document.getElementById('btn-convert-proforma-modal'); if(btnConvertProformaModal) btnConvertProformaModal.onclick = ()=> convertProformaToVente(state.proformas.find(x=>x.id===editing.id));

  // Modal generic
  const overlay = document.getElementById('overlay');
  if(overlay) overlay.onclick = (e)=>{ if(e.target.id==='overlay'){ editing=null; render(); } };
  const btnCancel = document.getElementById('btn-cancel'); if(btnCancel) btnCancel.onclick = ()=>{ editing=null; render(); };
  const btnDoPrint = document.getElementById('btn-do-print');
  if(btnDoPrint) btnDoPrint.onclick = ()=>{
    document.getElementById('receipt').innerHTML = editing.html;
    setTimeout(()=>window.print(), 100);
  };

  // Aperçu en direct du produit (stock total + marge détail) sans perdre le focus
  const liveInfoBox = document.getElementById('live-info-box');
  if(liveInfoBox){
    const qdFixe = editing.id ? (state.produits.find(x=>x.id===editing.id).quantiteDetail||0) : 0;
    const updateLive = ()=>{
      const qpc = Math.max(1, parseInt(document.getElementById('f-quantiteParCaisse').value)||1);
      const qc = parseInt(document.getElementById('f-quantiteCaisse').value)||0;
      const pa = parseFloat(document.getElementById('f-prixAchat').value)||0;
      const pvd = parseFloat(document.getElementById('f-prixVenteDetail').value)||0;
      liveInfoBox.innerHTML = produitLiveInfoHTML(qpc, qc, qdFixe, pa, pvd);
    };
    ['f-quantiteParCaisse','f-quantiteCaisse','f-prixAchat','f-prixVenteDetail'].forEach(id=>{
      const el = document.getElementById(id); if(el) el.oninput = updateLive;
    });
  }
  const btnRecalc = document.getElementById('btn-recalc-stock-initial');
  if(btnRecalc) btnRecalc.onclick = ()=>{
    const p = state.produits.find(x=>x.id===editing.id);
    p.stockInitial = stockUnites(p);
    log('Stock initial recalculé', `${p.nom} · ${fmt(p.stockInitial)} unité(s)`);
    saveState(); showToast('Stock initial mis à jour'); render();
  };

  // Editeur de types de lots (brouillon local productLotsDraft) — mise à jour ciblée, sans perdre les autres champs
  function currentProduitDraft(){
    return (editing && editing.id) ? state.produits.find(x=>x.id===editing.id) : {prixAchat:0, quantiteParCaisse:1};
  }
  if(editing && editing.type==='produit'){
    attachLotsEditorEvents(currentProduitDraft());
    const btnAddLotRow = document.getElementById('btn-add-lot-row');
    if(btnAddLotRow) btnAddLotRow.onclick = ()=>{
      productLotsDraft.push({id:uid(), taille:0, prix:0});
      const editor = document.getElementById('lots-editor');
      if(editor){ editor.innerHTML = lotsEditorHTML(currentProduitDraft()); attachLotsEditorEvents(currentProduitDraft()); }
    };
  }

  const btnSaveProduit = document.getElementById('btn-save-produit');
  if(btnSaveProduit) btnSaveProduit.onclick = ()=>{
    const data = {
      nom: document.getElementById('f-nom').value.trim(),
      categorie: document.getElementById('f-categorie').value.trim(),
      quantiteParCaisse: Math.max(1, parseInt(document.getElementById('f-quantiteParCaisse').value)||1),
      prixAchat: parseFloat(document.getElementById('f-prixAchat').value)||0,
      quantiteCaisse: parseInt(document.getElementById('f-quantiteCaisse').value)||0,
      prixVenteDetail: parseFloat(document.getElementById('f-prixVenteDetail').value)||0,
      stockMinimum: parseInt(document.getElementById('f-stockMinimum').value)||0,
      lots: productLotsDraft.filter(l=>l.taille>0 && l.prix>=0).map(l=>({id:l.id||uid(), taille:l.taille, prix:l.prix})),
    };
    if(!data.nom){ showToast('Le nom du produit est requis'); return; }
    if(editing.id){
      Object.assign(state.produits.find(x=>x.id===editing.id), data);
      log('Produit modifié', data.nom);
    } else {
      data.quantiteDetail = 0;
      data.stockInitial = (data.quantiteCaisse*data.quantiteParCaisse);
      data.dateCreation = new Date().toISOString();
      data.archive = false;
      state.produits.push({id:uid(), magasinId:state.currentMagasinId, ...data});
      log('Produit ajouté', data.nom);
    }
    saveState(); editing=null; render();
  };

  const btnSaveClient = document.getElementById('btn-save-client');
  if(btnSaveClient) btnSaveClient.onclick = ()=>{
    const nom = document.getElementById('f-nom').value.trim();
    const telephone = document.getElementById('f-telephone').value.trim();
    if(!nom){ showToast('Le nom du client est requis'); return; }
    if(editing.id){ Object.assign(state.clients.find(x=>x.id===editing.id), {nom, telephone}); log('Client modifié', nom); }
    else { state.clients.push({id:uid(), magasinId:state.currentMagasinId, nom, telephone}); log('Client ajouté', nom); }
    saveState(); editing=null; render();
  };

  document.querySelectorAll('[data-perm]').forEach(cb=>cb.onchange = ()=>{
    const key = cb.dataset.perm;
    if(cb.checked){ if(!permissionsDraft.includes(key)) permissionsDraft.push(key); }
    else{ permissionsDraft = permissionsDraft.filter(k=>k!==key); }
  });
  const applyPreset = (role)=>{
    permissionsDraft = PERMS_PRESETS[role].slice();
    document.querySelectorAll('[data-perm]').forEach(cb=>{ cb.checked = permissionsDraft.includes(cb.dataset.perm); });
  };
  const btnPresetAdmin = document.getElementById('btn-preset-admin'); if(btnPresetAdmin) btnPresetAdmin.onclick = ()=>applyPreset('Admin');
  const btnPresetGerant = document.getElementById('btn-preset-gerant'); if(btnPresetGerant) btnPresetGerant.onclick = ()=>applyPreset('Gerant');
  const btnPresetCaissier = document.getElementById('btn-preset-caissier'); if(btnPresetCaissier) btnPresetCaissier.onclick = ()=>applyPreset('Caissier');

  const btnGenPw = document.getElementById('btn-generate-password');
  if(btnGenPw) btnGenPw.onclick = async ()=>{
    if(!isAdminConnecte()){ showToast('Seul un administrateur peut gérer les mots de passe'); return; }
    const emp = state.employes.find(x=>x.id===editing.id);
    const emailVal = document.getElementById('f-email').value.trim();
    if(!emailVal){ showToast("Renseignez d'abord l'email de l'agent"); return; }
    const pw = generatePassword(8);
    const salt = uid();
    const hash = await hashPasswordSalted(pw, salt);
    emp.email = emailVal.toLowerCase();
    emp.passwordSalt = salt;
    emp.passwordHash = hash;
    generatedPasswordPreview = pw;
    log('Mot de passe généré', emp.nom);
    saveState(); render();
  };

  const btnSaveEmploye = document.getElementById('btn-save-employe');
  if(btnSaveEmploye) btnSaveEmploye.onclick = ()=>{
    const data = {
      nom: document.getElementById('f-nom').value.trim(),
      role: document.getElementById('f-role').value,
      telephone: document.getElementById('f-telephone').value.trim(),
      email: document.getElementById('f-email').value.trim().toLowerCase(),
      salaire: parseFloat(document.getElementById('f-salaire').value)||0,
      actif: document.getElementById('f-actif').value==='true',
      permissions: permissionsDraft.slice(),
    };
    if(!data.nom){ showToast('Le nom est requis'); return; }
    if(editing.id){ Object.assign(state.employes.find(x=>x.id===editing.id), data); log('Employé modifié', data.nom); }
    else { state.employes.push({id:uid(), magasinId:state.currentMagasinId, passwordHash:'', ...data}); log('Employé ajouté', data.nom); }
    generatedPasswordPreview='';
    saveState(); editing=null; render();
  };

  const btnSavePaydette = document.getElementById('btn-save-paydette');
  if(btnSavePaydette) btnSavePaydette.onclick = ()=>{
    const montant = parseFloat(document.getElementById('f-montant').value)||0;
    const mode = document.getElementById('f-mode').value;
    if(montant<=0){ showToast('Montant invalide'); return; }
    allocatePaymentToClient(editing.id, montant, mode);
    saveState(); editing=null; showToast('Paiement enregistré'); render();
  };

  const btnSavePaysalaire = document.getElementById('btn-save-paysalaire');
  if(btnSavePaysalaire) btnSavePaysalaire.onclick = ()=>{
    const montant = parseFloat(document.getElementById('f-montant').value)||0;
    const periode = document.getElementById('f-periode').value.trim();
    const mode = document.getElementById('f-mode').value;
    if(montant<=0){ showToast('Montant invalide'); return; }
    state.payrollPaiements.push({id:uid(), employeId:editing.id, montant, date:new Date().toISOString(), periode});
    if(mode==='cash'){
      state.caisseMovements.push({id:uid(), magasinId:state.currentMagasinId, date:new Date().toISOString(), type:'sortie', montant, motif:`Salaire — ${empName(editing.id)} (${periode||''})`, employeId:state.currentUserId, source:'payroll'});
    }
    log('Salaire payé', `${empName(editing.id)} · ${money(montant)}`);
    saveState(); editing=null; showToast('Salaire payé'); render();
  };

  const btnSaveCaisse = document.getElementById('btn-save-caisse');
  if(btnSaveCaisse) btnSaveCaisse.onclick = ()=>{
    const motif = document.getElementById('f-motif').value.trim();
    const montant = parseFloat(document.getElementById('f-montant').value)||0;
    if(!motif || montant<=0){ showToast('Motif et montant requis'); return; }
    state.caisseMovements.push({id:uid(), magasinId:state.currentMagasinId, date:new Date().toISOString(), type:editing.mode, montant, motif, employeId:state.currentUserId, source:'manuel'});
    log(editing.mode==='entree'?'Entrée de caisse manuelle':'Sortie de caisse manuelle', `${motif} · ${money(montant)}`);
    saveState(); editing=null; render();
  };

  const btnSaveMagasin = document.getElementById('btn-save-magasin');
  if(btnSaveMagasin) btnSaveMagasin.onclick = ()=>{
    const nom = document.getElementById('f-nom').value.trim();
    const adresse = document.getElementById('f-adresse').value.trim();
    const telephone = document.getElementById('f-telephone').value.trim();
    const email = document.getElementById('f-email').value.trim();
    if(!nom){ showToast('Le nom du magasin est requis'); return; }
    if(editing.id){
      const m = state.magasins.find(x=>x.id===editing.id);
      const logo = magasinLogoDraft!=null ? magasinLogoDraft : (m.logo||'');
      Object.assign(m, {nom, adresse, telephone, email, logo});
      log('Magasin modifié', nom);
    } else {
      const id = uid();
      const logo = magasinLogoDraft!=null ? magasinLogoDraft : '';
      state.magasins.push({id, nom, adresse, telephone, email, logo});
      state.currentMagasinId = id;
      log('Magasin créé', nom);
    }
    magasinLogoDraft = null;
    saveState(); editing=null; render();
  };
}

loadState();
</script>
</body>
</html>
