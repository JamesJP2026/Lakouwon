<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lakouwon — Gestion Business POS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lakouwon">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#132340; --navy-2:#1c3358; --gold:#c8973f; --gold-light:#e9c98a;
    --paper:#f6f4ef; --card:#ffffff; --ink:#182233; --ink-soft:#5b6577; --line:#e4e0d6;
    --green:#2f7d5a; --green-bg:#e7f3ec; --red:#e5383b; --red-bg:#fbebe9;
    --amber:#b7791f; --amber-bg:#fbf1de; --yellow:#ffc300; --ocean:#1f77a8;
    --lime:#bfe8cf; --lemon:#fff200; --radius:10px;
    --shadow:0 1px 2px rgba(19,35,64,.06), 0 6px 20px rgba(19,35,64,.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.num{font-family:'Manrope',sans-serif;}
  .num{font-variant-numeric:tabular-nums;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:14px;}
  input[type=number]{-moz-appearance:textfield;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#d8d3c5;border-radius:8px;}
  #app{display:flex; min-height:100vh;}

  .sidebar{width:230px; background:var(--navy); color:#dbe3f0; flex-shrink:0; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
  .brand{padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; align-items:center; gap:10px;}
  .brand-logo{width:34px; height:34px; border-radius:7px; object-fit:cover; background:#fff; flex-shrink:0;}
  .brand-name{font-family:'Manrope'; font-weight:800; font-size:16px; color:#fff; letter-spacing:.2px; line-height:1.2;}
  .brand-sub{font-size:11px; color:var(--gold-light); margin-top:2px;}
  .store-select{margin:14px 16px;}
  .store-select label{display:block; font-size:10.5px; color:#93a2bd; margin-bottom:5px;}
  .store-select select{width:100%; padding:8px 9px; border-radius:7px; border:1px solid rgba(255,255,255,.15); background:var(--navy-2); color:#fff; font-size:13px;}
  nav.navlinks{flex:1; padding:6px 10px; overflow-y:auto;}
  .navsection-label{padding:14px 12px 5px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:#7686a5;}
  .navsection-label:first-child{padding-top:6px;}
  .navlink{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; color:#c4cee2; font-size:13.5px; font-weight:500; margin-bottom:2px; border:none; background:none; width:100%; text-align:left;}
  .navlink:hover{background:rgba(255,255,255,.06); color:#fff;}
  .navlink.active{background:var(--gold); color:#1a1305; font-weight:700;}
  .navlink .ic{width:17px; text-align:center; opacity:.9; font-size:14px;}
  .navlink-badge{margin-left:auto; background:var(--red); color:#fff; font-size:10.5px; font-weight:800; padding:1px 6px; border-radius:20px; line-height:1.5;}
  .sidebar-foot{padding:14px 16px; border-top:1px solid rgba(255,255,255,.08); font-size:12px; color:#93a2bd;}
  .sidebar-foot b{color:#e7ecf5;}

  .main{flex:1; min-width:0; padding:26px 30px 60px;}
  .topbar{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  .topbar h1{font-size:22px; margin:0 0 4px; font-weight:800;}
  .topbar p{margin:0; color:var(--ink-soft); font-size:13px;}
  .topbar-actions{display:flex; gap:10px; flex-wrap:wrap;}

  .btn{padding:9px 15px; border-radius:8px; border:1px solid var(--line); background:var(--card); font-size:13.5px; font-weight:600; color:var(--ink); display:inline-flex; align-items:center; gap:7px;}
  .btn:hover{border-color:#c9c2ab;}
  .btn-primary{background:var(--navy); color:#fff; border-color:var(--navy);}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-gold{background:var(--gold); color:#1a1305; border-color:var(--gold);}
  .btn-danger{background:var(--red-bg); color:var(--red); border-color:#f0cfcb;}
  .btn-sm{padding:5px 10px; font-size:12.5px; border-radius:6px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-spinner{display:inline-block; width:12px; height:12px; border:2px solid rgba(0,0,0,.25); border-top-color:currentColor; border-radius:50%; animation:btn-spin .6s linear infinite; vertical-align:-1px;}
  @keyframes btn-spin{to{transform:rotate(360deg);}}

  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:22px;}
  .kpi{background:var(--ocean); color:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);}
  .kpi.pos{background:var(--green);}
  .kpi.neg{background:var(--red);}
  .kpi.gold{background:var(--yellow); color:#3a2a00;}
  .kpi.lime{background:var(--lime); color:#0b3d0b;}
  .kpi.lemon{background:var(--lemon); color:#4a4200;}
  .kpi.white{background:var(--card); color:var(--ink); border-color:var(--line);}
  .kpi .lbl{font-size:11.5px; color:rgba(255,255,255,.78); font-weight:700; text-transform:uppercase; letter-spacing:.4px;}
  .kpi .val{font-size:24px; font-weight:800; margin-top:6px; color:#fff;}
  .kpi .sub{font-size:12px; color:rgba(255,255,255,.72); margin-top:4px;}
  .kpi.gold .lbl, .kpi.gold .sub{color:rgba(58,42,0,.72);}
  .kpi.gold .val{color:#3a2a00;}
  .kpi.lime .lbl, .kpi.lime .sub{color:rgba(11,61,11,.72);}
  .kpi.lime .val{color:#0b3d0b;}
  .kpi.lemon .lbl, .kpi.lemon .sub{color:rgba(74,66,0,.72);}
  .kpi.lemon .val{color:#4a4200;}
  .kpi.white .lbl, .kpi.white .sub{color:var(--ink-soft);}
  .kpi.white .val{color:var(--ink);}

  .period-tabs{display:flex; gap:6px; margin-bottom:16px;}
  .period-tab{padding:6px 13px; border-radius:20px; border:1px solid var(--line); background:var(--card); font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .period-tab.active{background:var(--navy); color:#fff; border-color:var(--navy);}

  .grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr;}}

  .panel{background:var(--card); border:1px solid var(--line); border-top:3px solid var(--gold); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); margin-bottom:16px;}
  .panel h3{margin:0 0 12px; font-size:14.5px; font-weight:800; color:var(--navy);}
  .panel h3 .n{color:var(--ink-soft); font-weight:500; font-size:12px;}

  .alert-item{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; gap:10px;}
  .alert-item:last-child{border-bottom:none;}
  .tag{padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700;}
  .tag.low{background:var(--red-bg); color:var(--red);}

  .log-item{padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
  .log-item:last-child{border-bottom:none;}
  .log-time{color:var(--ink-soft); font-size:11.5px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; padding:9px 10px; background:#f1efe7; color:var(--ink-soft); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.3px; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .muted{color:var(--ink-soft);}
  .right{text-align:right;} .center{text-align:center;}

  .badge{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; display:inline-block;}
  .badge.cash{background:var(--green-bg); color:var(--green);}
  .badge.banque{background:#e7edfb; color:#2b52a3;}
  .badge.moncash{background:#f4e6fb; color:#7c3aa8;}
  .badge.credit{background:var(--amber-bg); color:var(--amber);}
  .badge.role-Admin{background:var(--navy); color:#fff;}
  .badge.role-Gerant{background:var(--amber-bg); color:var(--amber);}
  .badge.role-Caissier{background:#eef0f4; color:var(--ink-soft);}

  .toolbar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .search{padding:8px 12px; border:1px solid var(--line); border-radius:8px; font-size:13px; min-width:200px; background:var(--card);}

  .overlay{position:fixed; inset:0; background:rgba(19,25,40,.5); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50;}
  .modal{background:var(--card); border-radius:12px; width:100%; max-width:480px; padding:22px 24px; box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal.wide{max-width:700px;}
  .modal h2{font-size:17px; margin:0 0 16px; font-weight:800;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .help-ic{display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; border-radius:50%; background:var(--line); color:var(--ink-soft); font-size:10px; font-weight:800; margin-left:5px; cursor:help; vertical-align:middle;}
  .field input,.field select,.field textarea{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px; background:#fdfcfa;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold-light); border-color:var(--gold);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
  .info-box{background:#f8f6f0; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:12.5px; margin-bottom:12px;}

  .pos-grid{display:grid; grid-template-columns:1.4fr 1fr; gap:16px;}
  @media(max-width:960px){.pos-grid{grid-template-columns:1fr;}}
  .prod-pick{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; max-height:520px; overflow-y:auto; padding-right:4px;}
  .prod-card{border:1px solid var(--line); border-radius:9px; padding:11px; background:var(--card);}
  .prod-card:hover{border-color:var(--gold);}
  .prod-card.out{opacity:.45;}
  .prod-card .pn{font-weight:700; font-size:13px; margin-bottom:3px;}
  .prod-card .pp{color:var(--green); font-weight:700; font-size:13px;}
  .prod-card .pq{font-size:11px; color:var(--ink-soft); margin-top:3px;}
  .cart-item{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .cart-item .ci-name{flex:1; font-weight:600;}
  .cart-item input[type=number]{width:52px; padding:5px; border:1px solid var(--line); border-radius:6px;}
  .cart-total{display:flex; justify-content:space-between; font-size:16px; font-weight:800; padding:14px 0 4px; border-top:2px solid var(--navy); margin-top:10px;}
  .pay-modes{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:10px 0;}
  .pay-mode{padding:10px 6px; border:1px solid var(--line); border-radius:8px; text-align:center; font-size:12px; font-weight:700; background:var(--card);}
  .pay-mode.active{background:var(--navy); color:#fff; border-color:var(--navy);}

  .empty{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  select[disabled],input[disabled]{background:#f1efe7; color:var(--ink-soft);}
  .logo-preview{width:64px; height:64px; object-fit:contain; border:1px solid var(--line); border-radius:8px; background:#fff; padding:4px;}
  .client-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .client-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;}
  .cc-avatar{width:42px; height:42px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; flex-shrink:0;}
  .cc-name{font-weight:800; font-size:14.5px;}
  .cc-phone{font-size:12px;}
  .cc-stats{display:flex; justify-content:space-between; font-size:12.5px; padding:9px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .cc-debt{font-size:13px; font-weight:700; color:var(--green);}
  .cc-debt.debt-pos{color:var(--red);}
  .cc-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .product-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;}
  .product-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px;}
  .pc-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .pc-name{font-weight:800; font-size:14px; line-height:1.25;}
  .pc-cat{font-size:11.5px; margin-top:-6px;}
  .pc-lots{background:#f8f6f0; border-radius:7px; padding:7px 9px; min-height:30px;}
  .pc-meta{font-size:10.5px;}
  .breakdown-row{display:flex; justify-content:space-between; padding:5px 0; font-size:13px;}
  .breakdown-row.total{border-top:2px solid var(--navy); margin-top:6px; padding-top:8px; font-weight:800; font-size:15px;}

  .fab-vente{position:fixed; bottom:26px; right:26px; width:68px; height:68px; border-radius:50%; background:var(--ocean); color:#fff; border:3px solid #fff; font-size:30px; box-shadow:0 8px 22px rgba(19,35,64,.4); cursor:pointer; z-index:40; display:flex; align-items:center; justify-content:center;}
  .fab-vente:hover{transform:scale(1.06);}

  .mobile-topbar-toggle{display:none; position:fixed; top:12px; left:12px; z-index:56; width:42px; height:42px; border-radius:9px; background:var(--navy); color:#fff; border:none; font-size:18px; align-items:center; justify-content:center; box-shadow:var(--shadow);}
  .sidebar-close{display:none; background:none; border:none; color:#dbe3f0; font-size:18px; margin-left:auto; cursor:pointer; padding:4px;}
  .sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(10,16,30,.55); z-index:55;}
  .sidebar-overlay.show{display:block;}

  /* ---------- MOBILE / TABLETTE ---------- */
  @media(max-width:860px){
    .mobile-topbar-toggle{display:flex;}
    .sidebar-close{display:block;}
    .sidebar{position:fixed; top:0; left:0; height:100vh; width:250px; max-width:82vw; transform:translateX(-100%); transition:transform .25s ease; z-index:60;}
    .sidebar.open{transform:translateX(0);}
    .main{padding:70px 14px 80px;}
    .topbar{margin-bottom:16px;}
    .topbar h1{font-size:19px;}
    .btn{padding:11px 16px; font-size:14px;}
    .btn-sm{padding:8px 12px; font-size:13px;}
    .row2,.row3{grid-template-columns:1fr;}
    .kpi-row{grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
    .kpi{padding:13px 14px;}
    .kpi .val{font-size:20px;}
    .overlay{padding:16px 10px; align-items:center;}
    .modal{padding:18px 16px; max-height:92vh; overflow-y:auto;}
    .fab-vente{bottom:18px; right:18px; width:60px; height:60px; font-size:26px; border-width:2px;}
    .table-wrap table{font-size:12.5px;}
    th,td{padding:8px 7px;}
    .toolbar{flex-direction:column; align-items:stretch;}
    .toolbar .search{width:100%;}
  }

  @media print{
    body *{visibility:hidden;}
    #receipt,#receipt *{visibility:visible;}
    #receipt{position:fixed; top:0; left:0; width:100%; padding:20px;}
  }
  #receipt{display:none;}
</style>
</head>
<body>
<div id="app"></div>
<div id="receipt"></div>
<script type="module" src="src/js/app.js"></script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
